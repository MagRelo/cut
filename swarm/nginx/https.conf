# HTTPS + HTTP ACME — cert paths use certbot --cert-name cut (see scripts/bootstrap-tls.sh).
# Host-based routing: playthecut.com → web; base-sepolia.playthecut.com → web-staging.
# Expand SANs with scripts/expand-tls-staging.sh when adding the staging hostname.

resolver 127.0.0.11 valid=10s ipv6=off;

error_page 502 503 504 /502.html;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Production ---
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name playthecut.com www.playthecut.com;

    ssl_certificate     /etc/letsencrypt/live/cut/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cut/privkey.pem;

    location = /502.html {
        root /usr/share/nginx/html/errors;
        internal;
    }

    location / {
        set $upstream_app http://web:3000;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Privy/OAuth popups on iOS WebKit need opener communication (Google GIS docs).
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
}

# --- Staging (Base Sepolia) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name base-sepolia.playthecut.com;

    ssl_certificate     /etc/letsencrypt/live/cut/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cut/privkey.pem;

    location = /502.html {
        root /usr/share/nginx/html/errors;
        internal;
    }

    location / {
        set $upstream_app http://web-staging:3000;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
}
